name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install pinned npm
        run: |
          npm install --global npm@12.0.1
          node --version | grep '^v24\.15\.0$'
          npm --version | grep '^12\.0\.1$'

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce zero-warning lint
        run: npm run lint

      - name: Run full tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Verify dependency policy
        run: npm run verify:dependency-policy

      - name: Reject high-severity dependency findings
        run: npm audit --audit-level=high

      - name: Verify generated source is committed
        run: git diff --exit-code
