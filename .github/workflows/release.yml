name: Merge release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: merge-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.label }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            artifact: waypoint-macos-arm64
            path: release/*-mac-arm64.zip
          - label: Windows x64
            os: windows-2025
            artifact: waypoint-windows-x64
            path: release/*-win-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      WAYPOINT_BUILD_VERSION: 0.0.${{ github.run_number }}
      WAYPOINT_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out verified merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.WAYPOINT_RELEASE_SHA }}

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install pinned npm
        shell: bash
        run: |
          npm install --global npm@12.0.1
          node --version | grep '^v24\.15\.0$'
          npm --version | grep '^12\.0\.1$'

      - name: Install locked dependencies
        run: npm ci

      - name: Stamp immutable merge build version
        shell: bash
        run: npm version "$WAYPOINT_BUILD_VERSION" --no-git-tag-version

      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npm run package:release:mac

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: npm run package:release:windows

      - name: Verify packaged runtime closure
        run: npm run verify:package-runtime

      - name: Upload native release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish prerelease
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WAYPOINT_BUILD_VERSION: 0.0.${{ github.run_number }}
      WAYPOINT_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download verified native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Stage, verify, and publish immutable unsigned prerelease
        shell: bash
        run: |
          set -euo pipefail

          waypoint_release_tag="v${WAYPOINT_BUILD_VERSION}"
          waypoint_release_notes="Automated private preview from verified main commit ${WAYPOINT_RELEASE_SHA}. Includes macOS arm64 ZIP and Windows x64 installer plus SHA-256 checksums. These artifacts are unsigned development prereleases: Apple notarization and production Windows signing remain separate credential-backed release gates."

          waypoint_release_ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${waypoint_release_tag}\") | .id")"
          test "$(printf '%s\n' "$waypoint_release_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1
          waypoint_release_id="$(printf '%s\n' "$waypoint_release_ids" | sed '/^$/d')"

          if test -z "$waypoint_release_id"; then
            gh release create "$waypoint_release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$WAYPOINT_RELEASE_SHA" \
              --title "Waypoint ${WAYPOINT_BUILD_VERSION} (unsigned preview)" \
              --notes "$waypoint_release_notes" \
              --prerelease \
              --draft
            waypoint_release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${waypoint_release_tag}\") | .id")"
          fi

          waypoint_release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${waypoint_release_id}")"
          test "$(jq -r '.target_commitish' <<<"$waypoint_release_json")" = "$WAYPOINT_RELEASE_SHA"

          if test "$(jq -r '.draft' <<<"$waypoint_release_json")" = "false"; then
            test "$(jq -r '.prerelease' <<<"$waypoint_release_json")" = "true"
            waypoint_verify_dir="$(mktemp -d)"
            trap 'rm -rf "$waypoint_verify_dir"' EXIT
            gh release download "$waypoint_release_tag" --repo "$GITHUB_REPOSITORY" --dir "$waypoint_verify_dir"
            test "$(find "$waypoint_verify_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
            (cd "$waypoint_verify_dir" && sha256sum --check SHA256SUMS.txt)
            exit 0
          fi

          gh release upload "$waypoint_release_tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/waypoint-expected-assets.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${waypoint_release_id}/assets?per_page=100" \
            --jq '.[].name' | sort > /tmp/waypoint-actual-assets.txt
          diff -u /tmp/waypoint-expected-assets.txt /tmp/waypoint-actual-assets.txt
          test "$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${waypoint_release_id}/assets?per_page=100" \
            --jq '[.[] | select(.size == 0)] | length')" = "0"

          waypoint_verify_dir="$(mktemp -d)"
          trap 'rm -rf "$waypoint_verify_dir"' EXIT
          gh release download "$waypoint_release_tag" --repo "$GITHUB_REPOSITORY" --dir "$waypoint_verify_dir"
          test "$(find "$waypoint_verify_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
          (cd "$waypoint_verify_dir" && sha256sum --check SHA256SUMS.txt)

          printf '{"draft":false,"prerelease":true}\n' | gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${waypoint_release_id}" \
            --input - >/dev/null
          waypoint_release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${waypoint_release_id}")"
          test "$(jq -r '.draft' <<<"$waypoint_release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$waypoint_release_json")" = "true"
          test "$(jq -r '.target_commitish' <<<"$waypoint_release_json")" = "$WAYPOINT_RELEASE_SHA"
