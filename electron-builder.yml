appId: com.waypoint.desktop
productName: Waypoint
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/electron/**/*
  - dist-electron/node/relay/**/*.js
  - '!dist-electron/node/relay/**/*.test.js'
  - dist-electron/spikes/cli-capabilities.js
extraResources:
  - from: vendor/voice/fast-local-staging
    to: fast-local
  - from: build/icons/waypoint.png
    to: waypoint.png
  - from: vendor/browser-staging
    to: agent-browser
  - from: vendor/browser-network-lockdown
    to: browser-network-lockdown
  - from: vendor/product-help
    to: waypoint-help
mac:
  target: dir
  icon: build/icons/waypoint.png
  minimumSystemVersion: '13.3.0'
  category: public.app-category.productivity
  extraResources:
    - from: vendor/voice/macos-arm64
      to: voice
  extendInfo:
    NSMicrophoneUsageDescription: Waypoint uses microphone audio only after you explicitly start Voice Chat or a local meeting recording.
win:
  target: dir
  icon: build/icons/waypoint.png
